# SPDX-License-Identifier: MIT

[package]
name = "remote-switch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Remote switch firmware for the Circuit Dojo nRF9151 Feather"
readme = "README.md"
license = "MIT"
publish = false

[lib]
# zephyr-lang-rust links against librustapp.a.
name = "rustapp"
crate-type = ["staticlib"]

[dependencies]
embassy-sync = "0.8.0"

[target.'cfg(target_os = "none")'.dependencies]
zephyr = { version = "0.1.0", features = ["executor-zephyr"] }
zephyr-panic = "0.1.0"
log = "0.4.22"
static_cell = "2.1"
embassy-executor = { version = "0.10.0", features = ["log"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[build-dependencies]
zephyr-build = "0.1.0"

[profile.release]
overflow-checks = true

[patch.crates-io]
zephyr = { path = "../modules/lang/rust/zephyr" }
zephyr-build = { path = "../modules/lang/rust/zephyr-build" }
zephyr-sys = { path = "../modules/lang/rust/zephyr-sys" }
zephyr-panic = { path = "../modules/lang/rust/zephyr-panic" }
