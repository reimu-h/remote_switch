# SPDX-License-Identifier: MIT

# GPIO + debounced button input subsystem
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Console logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# Reset rather than halting with outputs latched if a fatal fault/panic occurs,
# and supervise liveness with the hardware watchdog (`aliases::watchdog0`)
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_WATCHDOG=y

# Rust support + Embassy executor integration
CONFIG_RUST=y
CONFIG_MAIN_STACK_SIZE=4096

# Cellular modem, LTE link control, and offloaded sockets
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y
CONFIG_LTE_MODE_PREFERENCE_LTE_M=y

# Default PDN: 1NCE APN (change it for other SIM providers), IPv4 only so the
# network never sends IPv6 router advertisements that would count as data.
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="iot.1nce.net"
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_NET_IPV6=n

# No background traffic: the app uses no DNS, NTP, or cloud services
CONFIG_LTE_LC_DNS_FALLBACK_MODULE=n

# Remote-command replay counter persisted with settings on NVS (storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Note: The UART debug shell (`rs msg ...` and `at ...`) is disabled by default
# for production safety and flash/RAM savings. Enable it for local bench testing
# with `CONFIG_REMOTE_SWITCH_DEBUG_SHELL=y` in `remote_switch.local.conf` or on
# the `west build` command line.
