# SPDX-License-Identifier: MIT

# GPIO + debounced button input subsystem
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Console logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# Reset rather than halting with outputs latched if a fatal fault/panic occurs
CONFIG_RESET_ON_FATAL_ERROR=y

# Rust support + Embassy executor integration
CONFIG_RUST=y
CONFIG_RUST_ALLOC=y
CONFIG_MAIN_STACK_SIZE=4096
