# SECURITY NOTE: By default, MCUboot signs images with its built-in development
# key (`root-ec-p256.pem`), which is public and NOT secure for production.
# For production deployments, generate an offline ECDSA-P256 keypair, keep the
# private key outside version control, and pass:
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/secure/path/to/prod-key.pem\"
SB_CONFIG_BOOTLOADER_MCUBOOT=y
