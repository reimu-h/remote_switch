# SPDX-License-Identifier: MIT

# I2C + nPM1300 PMIC LED and regulator drivers (status LED + 3.3 V VDDIO on BUCK1)
CONFIG_I2C=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

# Disable generic gpio-leds driver so Zephyr does not contend with Rust GpioPin
# ownership of the switch0 output node (compatible = "gpio-leds" in overlay)
CONFIG_LED_GPIO=n

# Prevent TF-M UART1 from conflicting with I2C and cluttering serial logs
CONFIG_TFM_SECURE_UART=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
